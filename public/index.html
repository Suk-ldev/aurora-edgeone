<!DOCTYPE html>
<html>
  <head>
    <title><%= VUE_APP_TITLE %></title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="description" content="<%= VUE_APP_META_DESC %>" />
    <meta name="robots" content="noindex, nofollow" />
    <%= VUE_APP_FAVICON %>
    <link rel="stylesheet" href="<%= BASE_URL %>static/phosphor-icons/regular/style.css" />
    <link rel="stylesheet" href="<%= BASE_URL %>static/site.css?v=<%= VUE_APP_TIME %>" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .is-darkmode {
        background-color: #272827;
      }
      .boot {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 14px;
        color: #999;
      }
      .boot-spin {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(128, 128, 128, 0.25);
        border-top-color: rgba(128, 128, 128, 0.7);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>Please enable JavaScript to continue.</strong>
    </noscript>
    <%= VUE_APP_LOADING %>
    <div id="app"></div>
    <%= VUE_APP_ENV %>
    <script>
      function isDarkMode() {
        var themeMedia = window.matchMedia('(prefers-color-scheme: dark)')
        var isDark = false
        var localMode = JSON.parse(localStorage.getItem('__APP__Darkmode') || '{}').value

        if (localMode !== undefined) {
          isDark = localMode === 'dark'
        } else if (__CFG.appTheme === 'dark') {
          isDark = true
        } else if (__CFG.appTheme === 'auto') {
          isDark = themeMedia.matches
        }
        return isDark
      }
      if (isDarkMode()) {
        document.body.classList.add('is-darkmode')
      }
      document.body.classList.add(__CFG.appColor)
    </script>
    <%= VUE_APP_HTML %>
    <!-- built files will be auto injected -->
    <script src="<%= BASE_URL %>static/site.js?v=<%= VUE_APP_TIME %>"></script>
  </body>
</html>
